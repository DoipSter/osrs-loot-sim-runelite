plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

// Override with -PruneLiteVersion=x.y.z to build against a specific release
def runeLiteVersion = project.findProperty('runeLiteVersion') ?: 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	testImplementation 'junit:junit:4.13.2'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
}

group = 'com.osrslootsim'
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Draws the side panel to a PNG without starting the game, for looking at layout changes:
//   gradlew panelPreview -Pout=build/panel.png -Papi=http://127.0.0.1:8777 -Psite=../osrs-loot-sim -Pboss=cox -Pset=cm:1,team:3
// api: where the simulator answers. site: a checkout of the website, for stand-in item and boss pictures (optional).
// boss: what to type in the boss box before the run; the first match is picked (optional). set: choices for that
// boss's options row (optional).
// Draws the insane-drop pop-ups to a PNG: gradlew cardPreview -Pout=build/cards.png -Psprite=<an item's picture file>
tasks.register('cardPreview', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.osrslootsim.CardPreview'
	jvmArgs '-Djava.awt.headless=true'
	args = [project.findProperty('out') ?: 'build/cards.png', project.findProperty('sprite') ?: '']
}

tasks.register('panelPreview', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.osrslootsim.PanelPreview'
	jvmArgs '-Djava.awt.headless=true'
	args = [
		project.findProperty('out') ?: 'build/panel.png',
		project.findProperty('api') ?: 'https://osrslootsim.com',
		project.findProperty('site') ?: '',
		project.findProperty('boss') ?: '',
		project.findProperty('set') ?: ''
	]
}
